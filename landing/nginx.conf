# Static landing behind the shared Caddy (which terminates TLS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a proxy the container's own host/port must never leak into a redirect (/en -> /en/).
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/ =404;
    }

    # nginx's stock mime.types has no entry for .webmanifest. default_type (not a types{} block) keeps every other mapping intact.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Fonts and images change only when their file name or ?v= changes.
    location ~* \.(woff2|webp|png|ico|svg)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}
