[project]
name = "agent-runtime"
version = "1.0.0"
description = "AI Workforce OS - agent runtime (FastAPI + CrewAI)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.7", "crewai>=1.0", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
