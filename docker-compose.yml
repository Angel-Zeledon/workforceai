services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workforce
      POSTGRES_PASSWORD: workforce
      POSTGRES_DB: workforce
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workforce"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for the drive (docs/architecture/drive.md).
  # RustFS is an Apache-2.0, MinIO-compatible server (MinIO no longer publishes
  # free community images). Internal only: no published port. In production use
  # S3, R2 or your own S3-compatible service and real credentials.
  objects:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-wfai-dev-access}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-wfai-dev-secret-change-me}
    volumes:
      - objdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  agent-runtime:
    build: ./agent-runtime
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SIMULATION: ${SIMULATION:-}
      MODEL: ${MODEL:-}
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:-}
      ALLOWED_PROVIDERS: ${ALLOWED_PROVIDERS:-}
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://workforce:workforce@postgres:5432/workforce?sslmode=disable
      REDIS_URL: redis://redis:6379
      RUNTIME_URL: http://agent-runtime:8000
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:-}
      ALLOWED_PROVIDERS: ${ALLOWED_PROVIDERS:-}
      PORT: "8080"
      BUDGET_USD: ${BUDGET_USD:-25}
      COST_CONFIRM_THRESHOLD_USD: ${COST_CONFIRM_THRESHOLD_USD:-}
      REQUEST_BUDGET_CAP_USD: ${REQUEST_BUDGET_CAP_USD:-}
      AGENT_BUDGET_USD: ${AGENT_BUDGET_USD:-}
      # Connections (docs/architecture/integrations-credentials.md). Without
      # CONNECTIONS_KEK only simulated connections work. Generate one with
      # `openssl rand -base64 32` and back it up apart from the database.
      CONNECTIONS_KEK: ${CONNECTIONS_KEK:-}
      CONNECTIONS_KEK_PREVIOUS: ${CONNECTIONS_KEK_PREVIOUS:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      LINKEDIN_OAUTH_CLIENT_ID: ${LINKEDIN_OAUTH_CLIENT_ID:-}
      LINKEDIN_OAUTH_CLIENT_SECRET: ${LINKEDIN_OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:-http://localhost:8080/api/v1/connections/oauth/callback}
      UI_BASE_URL: ${UI_BASE_URL:-http://localhost:3000}
      EMAIL_HOLD_SECONDS: ${EMAIL_HOLD_SECONDS:-60}
      KILL_SWITCH: ${KILL_SWITCH:-}
      # Drive: where file bytes live. Without S3_ENDPOINT/S3_BUCKET they go to
      # Postgres (fine for small installs). Credentials stay in the backend.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://objects:9000}
      S3_BUCKET: ${S3_BUCKET:-wfai-drive}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wfai-dev-access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-wfai-dev-secret-change-me}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
      DRIVE_MAX_FILE_MB: ${DRIVE_MAX_FILE_MB:-}
      DRIVE_QUOTA_MB: ${DRIVE_QUOTA_MB:-}
      # Accounts: sign up and log in with email and password (our own auth, no
      # third-party login). The open demo without login is a separate mode:
      # `make demo` (docker-compose.demo.yml sets AUTH_ENABLED=false).
      # The JWT_SECRET default below is for local development ONLY: in production
      # set your own (>= 32 random bytes, e.g. `openssl rand -base64 48`) and
      # ALLOWED_ORIGINS=https://your-frontend. See backend/README.md.
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # The refresh token lives in an HttpOnly cookie. Secure is off here only
      # because local dev runs on plain http; leave it on (default) in production.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-}
      STANDING_APPROVAL_DAYS: ${STANDING_APPROVAL_DAYS:-30}
      # --- DEVELOPMENT ONLY --- POST /demo/reset (admin role when auth is on).
      ENABLE_DEMO_RESET: "true"
      # Code sandbox (profile "sandbox", `make up-sandbox`): when both are set,
      # agents with the "code" tool can ask to run Python, ALWAYS with human
      # approval. Leave them empty to keep code execution unavailable.
      SANDBOX_URL: ${SANDBOX_URL:-}
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      SANDBOX_MAX_RUNTIME_SECONDS: ${SANDBOX_MAX_RUNTIME_SECONDS:-60}
      SANDBOX_MAX_RUNS_PER_DAY: ${SANDBOX_MAX_RUNS_PER_DAY:-20}
      # Web tool (docs/architecture/agent-web.md): search is unavailable until a provider is set; fetch works without.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      WEB_SEARCH_URL: ${WEB_SEARCH_URL:-}
      WEB_SEARCH_COST_USD: ${WEB_SEARCH_COST_USD:-0.005}
      WEB_MAX_CALLS_PER_DAY: ${WEB_MAX_CALLS_PER_DAY:-200}
      WEB_ALLOWED_HOSTS: ${WEB_ALLOWED_HOSTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      objects:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # ---- Code sandbox (docs/architecture/code-sandbox.md) -- DISABLED by default ----
  # Start it with `make up-sandbox` (profile "sandbox"). WARNING: this is the
  # only service with the Docker socket, which is root-equivalent on the host.
  # Never publish its port, never mount the socket anywhere else; for a stronger
  # boundary use a dedicated/rootless/remote daemon and SANDBOX_RUNTIME=runsc.
  sandbox-image:
    profiles: ["sandbox"]
    build: ./sandbox
    image: wfai-sandbox-python:1
    entrypoint: ["true"]
    restart: "no"

  sandbox-runner:
    profiles: ["sandbox"]
    build:
      context: ./backend
      dockerfile: Dockerfile.sandbox-runner
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}  # required: the runner refuses to start without it
      SANDBOX_IMAGE: wfai-sandbox-python:1
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      SANDBOX_MAX_RUNTIME_SECONDS: ${SANDBOX_MAX_RUNTIME_SECONDS:-60}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-512}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-2}
      PORT: "8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - sandbox-image
    # No published ports: only the backend reaches it, on the internal network.

volumes:
  pgdata:
  objdata:
