services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workforce
      POSTGRES_PASSWORD: workforce
      POSTGRES_DB: workforce
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workforce"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for the drive (docs/architecture/drive.md).
  # RustFS is an Apache-2.0, MinIO-compatible server (MinIO no longer publishes
  # free community images). Internal only: no published port. In production use
  # S3, R2 or your own S3-compatible service and real credentials.
  objects:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-wfai-dev-access}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-wfai-dev-secret-change-me}
    volumes:
      - objdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  agent-runtime:
    build: ./agent-runtime
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SIMULATION: ${SIMULATION:-}
      MODEL: ${MODEL:-}
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:-}
      ALLOWED_PROVIDERS: ${ALLOWED_PROVIDERS:-}
    ports:
      - "8000:8000"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://workforce:workforce@postgres:5432/workforce?sslmode=disable
      REDIS_URL: redis://redis:6379
      RUNTIME_URL: http://agent-runtime:8000
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:-}
      ALLOWED_PROVIDERS: ${ALLOWED_PROVIDERS:-}
      PORT: "8080"
      BUDGET_USD: ${BUDGET_USD:-25}
      COST_CONFIRM_THRESHOLD_USD: ${COST_CONFIRM_THRESHOLD_USD:-}
      REQUEST_BUDGET_CAP_USD: ${REQUEST_BUDGET_CAP_USD:-}
      AGENT_BUDGET_USD: ${AGENT_BUDGET_USD:-}
      # Connections (docs/architecture/integrations-credentials.md). Without
      # CONNECTIONS_KEK only simulated connections work. Generate one with
      # `openssl rand -base64 32` and back it up apart from the database.
      CONNECTIONS_KEK: ${CONNECTIONS_KEK:-}
      CONNECTIONS_KEK_PREVIOUS: ${CONNECTIONS_KEK_PREVIOUS:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:-http://localhost:8080/api/v1/connections/oauth/callback}
      UI_BASE_URL: ${UI_BASE_URL:-http://localhost:3000}
      EMAIL_HOLD_SECONDS: ${EMAIL_HOLD_SECONDS:-60}
      KILL_SWITCH: ${KILL_SWITCH:-}
      # Drive: where file bytes live. Without S3_ENDPOINT/S3_BUCKET they go to
      # Postgres (fine for small installs). Credentials stay in the backend.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://objects:9000}
      S3_BUCKET: ${S3_BUCKET:-wfai-drive}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wfai-dev-access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-wfai-dev-secret-change-me}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
      DRIVE_MAX_FILE_MB: ${DRIVE_MAX_FILE_MB:-}
      DRIVE_QUOTA_MB: ${DRIVE_QUOTA_MB:-}
      # --- DEVELOPMENT ONLY ---
      # Dev runs open (no login, fixed "demo" org) and exposes POST /demo/reset
      # for scripts/smoke and the e2e suite. In production OMIT both lines (the
      # defaults are false) and set AUTH_ENABLED=true, JWT_SECRET (>=32 bytes)
      # and ALLOWED_ORIGINS=https://your-frontend. See backend/README.md.
      AUTH_ENABLED: "false"
      ENABLE_DEMO_RESET: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      objects:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  objdata:
