# Compose de PRODUCCION (independiente; no se combina con docker-compose.yml de dev).
#
#   Imagenes de GHCR (CI):   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#                            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   Build local (sin GHCR):  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Solo Caddy publica puertos (80/443). Todo lo demas vive en la red `internal`
# (sin salida a internet). El runtime ademas se une a `egress` para llamar a DeepSeek.
#
# Archivos (docs/architecture/drive.md): los bytes van al almacenamiento S3 interno `objects`
# (RustFS, sin puerto publicado, volumen objdata). S3_ACCESS_KEY y S3_SECRET_KEY son obligatorias.
# Sandbox de codigo y render de paginas PDF (docs/architecture/code-sandbox.md): APAGADO por
# defecto. Se enciende con COMPOSE_PROFILES=sandbox y SANDBOX_TOKEN en .env.prod.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

name: aiworkforce

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?define DOMAIN (ej. app.ejemplo.com)}
      ACME_EMAIL: ${ACME_EMAIL:?define ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge: {}
      internal:
        # Fixed address so the backend can trust exactly this proxy (TRUSTED_PROXIES).
        ipv4_address: 172.31.250.10
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workforce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-workforce}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
    logging: *logging

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?define REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?define REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 384m
    cpus: 0.5
    logging: *logging

  # Almacenamiento S3 de los archivos (el mismo RustFS que en desarrollo). Solo en `internal`:
  # sin puerto publicado ni salida a internet. Respaldo del volumen: docs/architecture/drive.md.
  objects:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?define S3_ACCESS_KEY (openssl rand -hex 16)}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?define S3_SECRET_KEY (openssl rand -hex 32)}
    volumes:
      - objdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    cpus: 0.5
    logging: *logging

  agent-runtime:
    image: ghcr.io/${OWNER:?define OWNER (usuario/org de GHCR, minusculas)}/aiworkforce-agent-runtime:${TAG:?define TAG}
    build: ./agent-runtime
    restart: unless-stopped
    environment:
      # At least one provider key: Gemini (preferred when set) or DeepSeek.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SIMULATION: "false"
      MODEL: ${MODEL:-}
      # Shared secret with the backend (recommended; the backend warns when empty).
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:-}
      # Operator ceiling of model providers (comma-separated; empty = all configured).
      ALLOWED_PROVIDERS: ${ALLOWED_PROVIDERS:-}
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0
    logging: *logging

  backend:
    image: ghcr.io/${OWNER:?define OWNER}/aiworkforce-backend:${TAG:?define TAG}
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-workforce}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-workforce}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RUNTIME_URL: http://agent-runtime:8000
      PLATFORM_LLM_PROVIDER: ${PLATFORM_LLM_PROVIDER:-}
      VENDOR_INTEGRATIONS: ${VENDOR_INTEGRATIONS:-}
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:-}
      ALLOWED_PROVIDERS: ${ALLOWED_PROVIDERS:-}
      PORT: "8080"
      BUDGET_USD: ${BUDGET_USD:-25}
      SIMULATION: "false"
      AUTH_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET (min. 32 chars)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?define ALLOWED_ORIGINS (ej. https://app.ejemplo.com)}
      ENABLE_DEMO_RESET: ${ENABLE_DEMO_RESET:-false}
      # Caddy is the only proxy in front of the backend: honour X-Forwarded-For only from its fixed
      # address on `internal`, so auth rate limits count real client IPs instead of the proxy's.
      # If another proxy/CDN sits in front of Caddy, append its ranges (and keep 172.31.250.10).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.31.250.10}
      # Connection vault key (docs/architecture/integrations-credentials.md). Empty = only simulated
      # connections; no real credential is stored (fails closed). See .env.prod.example.
      CONNECTIONS_KEK: ${CONNECTIONS_KEK:-}
      CONNECTIONS_KEK_PREVIOUS: ${CONNECTIONS_KEK_PREVIOUS:-}
      # Generic API sources may reach private/LAN addresses only when explicitly true
      # (self-hosted on a trusted network; integrations-credentials.md sec. 18.8). Keep false.
      CUSTOM_API_ALLOW_PRIVATE: ${CUSTOM_API_ALLOW_PRIVATE:-false}
      # Archivos: S3 interno (servicio objects). Las credenciales solo llegan al backend.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://objects:9000}
      S3_BUCKET: ${S3_BUCKET:-wfai-drive}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?define S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?define S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-true}
      # Subidas en streaming (disco temporal -> S3): tope por archivo (500 MB por defecto con S3).
      DRIVE_MAX_UPLOAD_MB: ${DRIVE_MAX_UPLOAD_MB:-}
      DRIVE_MAX_FILE_MB: ${DRIVE_MAX_FILE_MB:-}
      DRIVE_QUOTA_MB: ${DRIVE_QUOTA_MB:-}
      # Busqueda por significado (docs/architecture/agent-search.md). APAGADA por defecto: los
      # documentos de clientes solo pueden ir a Gemini con facturacion de pago (en el nivel gratuito
      # Google usa los datos). Para encenderla: EMBEDDINGS_PROVIDER=gemini (usa GEMINI_API_KEY).
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      EMBEDDINGS_DIMENSIONS: ${EMBEDDINGS_DIMENSIONS:-}
      EMBEDDINGS_DAILY_TOKENS: ${EMBEDDINGS_DAILY_TOKENS:-}
      EMBEDDINGS_PRICE_PER_M: ${EMBEDDINGS_PRICE_PER_M:-}
      # Sandbox (perfil "sandbox"): sin SANDBOX_TOKEN code.run y el render de paginas no existen.
      SANDBOX_URL: ${SANDBOX_URL:-http://sandbox-runner:8090}
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      SANDBOX_MAX_RUNTIME_SECONDS: ${SANDBOX_MAX_RUNTIME_SECONDS:-60}
      SANDBOX_MAX_RUNS_PER_DAY: ${SANDBOX_MAX_RUNS_PER_DAY:-20}
    networks: [internal]
    depends_on:
      objects:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    cpus: 1.0
    logging: *logging

  frontend:
    image: ghcr.io/${OWNER:?define OWNER}/aiworkforce-frontend:${TAG:?define TAG}
    build:
      context: ./frontend
      # Vacios = rutas relativas (/api/v1) y WS derivado de window.location.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    restart: unless-stopped
    networks: [internal]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    logging: *logging

  # ---- Sandbox de codigo + render de paginas PDF -- APAGADO por defecto ----
  # Encender: COMPOSE_PROFILES=sandbox y SANDBOX_TOKEN (openssl rand -hex 24) en .env.prod, y
  #   docker compose -f docker-compose.prod.yml --env-file .env.prod build sandbox-image sandbox-render-image sandbox-runner
  # AVISO: sandbox-runner monta el socket de Docker (equivale a root en el host). No publica puerto,
  # vive solo en `internal` y exige el token. Cada ejecucion corre en un contenedor desechable con
  # --network none, raiz de solo lectura, sin capacidades y con topes de CPU/memoria/pids/tiempo.
  # Recomendado en produccion: SANDBOX_RUNTIME=runsc (gVisor) instalado en el host.
  sandbox-image:
    profiles: ["sandbox"]
    build: ./sandbox
    image: wfai-sandbox-python:1
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  sandbox-render-image:
    profiles: ["sandbox"]
    build: ./sandbox/render
    image: wfai-sandbox-render:1
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  sandbox-runner:
    profiles: ["sandbox"]
    build:
      context: ./backend
      dockerfile: Dockerfile.sandbox-runner
    image: aiworkforce-sandbox-runner:local
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}  # obligatorio (>= 16 caracteres): sin el, el runner no arranca
      SANDBOX_IMAGE: wfai-sandbox-python:1
      SANDBOX_RENDER_IMAGE: ${SANDBOX_RENDER_IMAGE:-wfai-sandbox-render:1}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      SANDBOX_MAX_RUNTIME_SECONDS: ${SANDBOX_MAX_RUNTIME_SECONDS:-60}
      # Topes de CADA ejecucion (contenedor desechable, sin red)
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-512}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1}
      SANDBOX_PIDS: ${SANDBOX_PIDS:-128}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-2}
      PORT: "8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]
    depends_on:
      - sandbox-image
      - sandbox-render-image
    healthcheck:
      test: ["CMD", "sandbox-runner", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Topes del propio runner (las ejecuciones tienen los suyos, arriba)
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

networks:
  edge:
  egress:
  internal:
    internal: true
    # Pinned subnet so Caddy has a stable address the backend can trust (TRUSTED_PROXIES).
    # If it overlaps a network already on the host, change it here, in Caddy's ipv4_address
    # and in TRUSTED_PROXIES together. Changing it on an existing install needs
    # `docker compose down` (volumes are kept) before `up`.
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  pgdata:
  objdata:
  redisdata:
  caddy_data:
  caddy_config:
