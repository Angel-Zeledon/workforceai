# AI Workforce OS on the shared VPS (alongside stockai).
#   workforceai.es      -> landing (static)
#   app.workforceai.es  -> app: personal accounts (signup / login), one organization per account,
#                          frontend + backend + Postgres + runtime
#
# TLS and routing come from the EXISTING Caddy of the stockai project, which owns ports 80/443.
# This project never publishes ports: its edge services join that Caddy's network (`faro_default`)
# under unique `wf-*` aliases, and everything else stays on a private network.
# Accounts need Postgres (users, organizations and tenant isolation live there). Secrets come from ./.env, which is
# NOT in git (create it once on the server): POSTGRES_PASSWORD and JWT_SECRET (>= 32 bytes), e.g. `openssl rand -hex 32`.
# Optional in ./.env: RUNTIME_TOKEN (`openssl rand -hex 32`, shared backend -> runtime secret) and CONNECTIONS_KEK
# (`openssl rand -base64 32`, the connection vault key; without it only simulated connections work and no real
# credential is stored). Back CONNECTIONS_KEK up OUTSIDE the server (password manager): backup.sh dumps only the
# database, and the stored credentials cannot be decrypted without the key. To rotate it, move the current value to
# CONNECTIONS_KEK_PREVIOUS and put a new one in CONNECTIONS_KEK.
# The runtime stays in SIMULATION mode (no model API keys, no cost) until a provider key is configured.
#
# Files (docs/architecture/drive.md): the bytes live in the internal S3 store `wf-objects` (RustFS, no published
# port, volume wf-objdata). REQUIRED in ./.env: S3_ACCESS_KEY (`openssl rand -hex 16`) and S3_SECRET_KEY
# (`openssl rand -hex 32`). Files uploaded before S3 stay readable from Postgres; move them with
#   docker compose exec wf-backend server ctl objects-to-s3            (copy + verify)
#   docker compose exec wf-backend server ctl objects-to-s3 -delete    (then free the Postgres copies)
# backup.sh also copies the objects volume.
# Code sandbox + PDF page rendering (docs/architecture/code-sandbox.md): OFF by default. Turn on with
# COMPOSE_PROFILES=sandbox and SANDBOX_TOKEN (`openssl rand -hex 24`) in ./.env.
# Search by meaning (docs/architecture/agent-search.md): OFF by default (EMBEDDINGS_PROVIDER empty). Customer documents
# may only go to Gemini once the key is on PAID billing (on the free tier Google uses the data); then set
# EMBEDDINGS_PROVIDER=gemini and GEMINI_API_KEY in ./.env. With the OpenAI platform key: EMBEDDINGS_PROVIDER=openai and
# EMBEDDINGS_API_KEY=<the same OPENAI_API_KEY> (text-embedding-3-small, USD 0.02 per million tokens).
name: workforceai

services:
  wf-postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workforce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD in deploy/vps/.env}
      POSTGRES_DB: workforce
    volumes:
      - wf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workforce -d workforce"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 384m
    networks: [internal]

  # S3-compatible storage of the drive (same RustFS as in development). Private network only, no published port.
  wf-objects:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?define S3_ACCESS_KEY in deploy/vps/.env (openssl rand -hex 16)}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?define S3_SECRET_KEY in deploy/vps/.env (openssl rand -hex 32)}
    volumes:
      - wf-objdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 384m
    cpus: 0.5
    networks: [internal]

  wf-runtime:
    build: ../../agent-runtime
    restart: unless-stopped
    environment:
      # Live models: set OPENAI_API_KEY and SIMULATION=false in ./.env (the platform model is OpenAI gpt-5-mini, see
      # PLATFORM_LLM_PROVIDER on the backend). Without both it stays in simulation (no network, no cost).
      SIMULATION: ${SIMULATION:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Operator ceiling of model providers (comma-separated; empty = all configured). Production keeps the providers
      # whose API also serves embeddings (search by meaning): ALLOWED_PROVIDERS=openai,gemini,custom.
      ALLOWED_PROVIDERS: ${ALLOWED_PROVIDERS:-}
      # Shared secret with the backend; empty = unauthenticated calls (the backend logs a warning).
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:-}
    mem_limit: 768m
    networks: [internal]

  wf-backend:
    build: ../../backend
    restart: unless-stopped
    depends_on:
      wf-runtime:
        condition: service_healthy
      wf-postgres:
        condition: service_healthy
      wf-objects:
        condition: service_healthy
    environment:
      PORT: "8080"
      RUNTIME_URL: http://wf-runtime:8000
      RUNTIME_TOKEN: ${RUNTIME_TOKEN:-}
      # Platform model answered with the operator's key; must match the key the runtime has (openai by default).
      PLATFORM_LLM_PROVIDER: ${PLATFORM_LLM_PROVIDER:-openai}
      # Shown in settings as the platform model; keep it equal to the runtime's OPENAI_MODEL.
      PLATFORM_LLM_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      ALLOWED_PROVIDERS: ${ALLOWED_PROVIDERS:-}
      BUDGET_USD: "5"
      UI_BASE_URL: https://app.workforceai.es
      ALLOWED_ORIGINS: https://app.workforceai.es
      DATABASE_URL: postgres://workforce:${POSTGRES_PASSWORD}@wf-postgres:5432/workforce?sslmode=disable
      # Personal accounts: signup creates an organization (the user is its owner); every organization is isolated.
      AUTH_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET in deploy/vps/.env (>= 32 bytes)}
      ENABLE_DEMO_RESET: "false"
      # "Try it without signing up": throwaway accounts that stop working after 24 h (3 per client address per day).
      TRIAL_ENABLED: "true"
      TRIAL_EMAIL_DOMAIN: prueba.workforceai.es
      # E-mail verification of new accounts. Turn on in ./.env (EMAIL_VERIFICATION=true) once the SMTP_* values are set there;
      # the backend refuses to start with verification on and no working SMTP, so a half-configured server cannot lock people out.
      EMAIL_VERIFICATION: ${EMAIL_VERIFICATION:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-no-reply@workforceai.es}
      # The password is a secret: it lives only in ./.env on the server (never in this repository).
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@workforceai.es}
      SMTP_TLS: ${SMTP_TLS:-tls}
      # Caddy (stockai project) is the only proxy in front: trust its X-Forwarded-For so rate limits count real client IPs.
      TRUSTED_PROXIES: 172.16.1.0/24
      # Connection vault key, only from ./.env (never a value here). See the header for generation and backup.
      CONNECTIONS_KEK: ${CONNECTIONS_KEK:-}
      CONNECTIONS_KEK_PREVIOUS: ${CONNECTIONS_KEK_PREVIOUS:-}
      # Generic API sources may reach private/LAN addresses only when true (docs/architecture/integrations-credentials.md
      # sec. 18.8). This is a shared VPS: keep it false.
      CUSTOM_API_ALLOW_PRIVATE: ${CUSTOM_API_ALLOW_PRIVATE:-false}
      # Plans (docs/architecture/approvals-notify.md 3.1) paid with ONVO Pay (docs/architecture/billing-onvo.md). All off
      # by default; set them in ./.env. PLANS=on puts every organization without a subscription on Free. The ONVO keys
      # are secrets: only in ./.env. With ONVO_SECRET_KEY the rest is required (the backend refuses to start without it).
      PLANS: ${PLANS:-off}
      PLAN_SELF_SERVE: ${PLAN_SELF_SERVE:-off}
      ONVO_SECRET_KEY: ${ONVO_SECRET_KEY:-}
      ONVO_PUBLISHABLE_KEY: ${ONVO_PUBLISHABLE_KEY:-}
      ONVO_WEBHOOK_SECRET: ${ONVO_WEBHOOK_SECRET:-}
      ONVO_PRICE_PRO_MONTHLY: ${ONVO_PRICE_PRO_MONTHLY:-}
      ONVO_PRICE_PRO_YEARLY: ${ONVO_PRICE_PRO_YEARLY:-}
      ONVO_PRICE_MAX_MONTHLY: ${ONVO_PRICE_MAX_MONTHLY:-}
      ONVO_PRICE_MAX_YEARLY: ${ONVO_PRICE_MAX_YEARLY:-}
      # Files: the internal S3 store (wf-objects). Its credentials reach only the backend.
      S3_ENDPOINT: http://wf-objects:9000
      S3_BUCKET: wfai-drive
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?define S3_ACCESS_KEY in deploy/vps/.env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?define S3_SECRET_KEY in deploy/vps/.env}
      S3_USE_PATH_STYLE: "true"
      # Uploads are streamed (temporary file -> S3), so the backend's 256 MB stays enough. Per file, default 500 MB.
      DRIVE_MAX_UPLOAD_MB: ${DRIVE_MAX_UPLOAD_MB:-}
      DRIVE_QUOTA_MB: ${DRIVE_QUOTA_MB:-}
      # Search by meaning: OFF until Gemini is on paid billing (see the header).
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDINGS_DIMENSIONS: ${EMBEDDINGS_DIMENSIONS:-}
      EMBEDDINGS_DAILY_TOKENS: ${EMBEDDINGS_DAILY_TOKENS:-}
      # Code sandbox and PDF page rendering (profile "sandbox"): without SANDBOX_TOKEN they do not exist.
      SANDBOX_URL: http://wf-sandbox-runner:8090
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      SANDBOX_MAX_RUNTIME_SECONDS: ${SANDBOX_MAX_RUNTIME_SECONDS:-60}
      SANDBOX_MAX_RUNS_PER_DAY: ${SANDBOX_MAX_RUNS_PER_DAY:-20}
    mem_limit: 256m
    networks: [internal, edge]

  wf-frontend:
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_API_URL: https://app.workforceai.es/api/v1
        NEXT_PUBLIC_WS_URL: wss://app.workforceai.es/ws
    restart: unless-stopped
    mem_limit: 384m
    networks: [internal, edge]

  wf-landing:
    build: ../../landing
    restart: unless-stopped
    mem_limit: 64m
    networks: [edge]

  # ---- Code sandbox + PDF page rendering -- OFF by default (profile "sandbox") ----
  # On: COMPOSE_PROFILES=sandbox and SANDBOX_TOKEN in ./.env, then ./deploy.sh (it builds the images).
  # WARNING: wf-sandbox-runner mounts the Docker socket, which is root on this SHARED host (stockai runs here too). It
  # publishes no port, lives only on the private network and requires the token. Every run is a throwaway container
  # with --network none, read-only root, no capabilities and the CPU / memory / pids / time caps below. Prefer
  # SANDBOX_RUNTIME=runsc (gVisor installed on the host) before turning on desk mode for anyone.
  wf-sandbox-image:
    profiles: ["sandbox"]
    build: ../../sandbox
    image: wfai-sandbox-python:1
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  wf-sandbox-render-image:
    profiles: ["sandbox"]
    build: ../../sandbox/render
    image: wfai-sandbox-render:1
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  wf-sandbox-runner:
    profiles: ["sandbox"]
    build:
      context: ../../backend
      dockerfile: Dockerfile.sandbox-runner
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}  # required (>= 16 chars): the runner refuses to start without it
      SANDBOX_IMAGE: wfai-sandbox-python:1
      SANDBOX_RENDER_IMAGE: wfai-sandbox-render:1
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      SANDBOX_MAX_RUNTIME_SECONDS: ${SANDBOX_MAX_RUNTIME_SECONDS:-60}
      # Caps of EACH run (shared VPS: half a CPU, 512 MB, one run at a time)
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-512}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-0.5}
      SANDBOX_PIDS: ${SANDBOX_PIDS:-128}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-1}
      PORT: "8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - wf-sandbox-image
      - wf-sandbox-render-image
    healthcheck:
      test: ["CMD", "sandbox-runner", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m
    cpus: 0.5
    networks: [internal]

volumes:
  wf-pgdata: {}
  wf-objdata: {}

networks:
  internal: {}
  edge:
    external: true
    name: faro_default
